[project]
name = "xbot"
version = "0.1.0"
description = "Personal build-in-public agent for X"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "sqlalchemy[asyncio]>=2.1",
    "psycopg[binary]>=3.3",
    "alembic>=1.20",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "anthropic>=2.6",
    "httpx>=0.28",
    "apscheduler>=3.11,<4",
    "structlog>=26",
    "cryptography>=50",
    "itsdangerous>=2.2",
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "respx>=0.23",
    "ruff>=0.17",
    "mypy>=1.19",
]

[project.scripts]
xbot = "xbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM"]
ignore = ["S101"]  # asserts in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
